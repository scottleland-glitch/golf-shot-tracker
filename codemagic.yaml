# Strokewise iPhone app + Apple Watch app – built on Codemagic's Macs (free plan), sent to TestFlight.
# Started by hand from Codemagic (no automatic builds).
# Before the first build (one time, in Codemagic): add the App Store Connect API key under Team → Integrations with the name
# "Strokewise ASC", and the Apple Distribution certificate + App Store profiles for com.strokewise.app and
# com.strokewise.app.watchkitapp under Code signing identities. The watch App ID and the iPhone App ID both need the HealthKit
# capability, and the iPhone profile must be regenerated after adding it. Plain-English steps are in WATCH_README.md.
# Those signing pieces were already set up for earlier watch-app builds.
workflows:
  ios-testflight:
    name: Strokewise iOS + Apple Watch → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Strokewise ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.strokewise.app
        # If the build says it cannot find a profile for com.strokewise.app.watchkitapp, list both profiles by the names they have in
        # Codemagic (Team → Code signing identities) instead of bundle_identifier, e.g.:
        #   provisioning_profiles: [Strokewise App Store, Strokewise Watch App Store]
        #   certificates: [Strokewise Distribution]
      vars:
        STROKEWISE_WATCH: "1"       # turns on the watch link in the web files, the watch plugin and the watch target (native/ios-setup.sh)
      node: 22
      xcode: latest
    scripts:
      - name: Install Capacitor
        script: npm install --no-audit --no-fund
      - name: Build the iPhone project + add the Apple Watch app (web files, watch plugin, icon, settings, watch target)
        script: bash native/ios-setup.sh
      - name: Use the signing profiles (iPhone app and watch app)
        script: xcode-project use-profiles
      - name: Check the iPhone profile has HealthKit (needed to launch the watch app when a round starts; if not, says so and builds without it)
        script: bash native/check-phone-healthkit.sh
      - name: Version 1.0, next build number after the newest one in App Store Connect (iPhone app and watch app must match)
        script: |
          # Codemagic's own counter restarts when a workflow changes, so ask App Store Connect for the newest build number
          # and use one more than that (or Codemagic's counter, whichever is higher).
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.strokewise.app --strict-match-identifier --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])' || echo "")
          LATEST=0
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-build-number "$APP_ID" --no-color 2>/dev/null | tail -1 | tr -cd '0-9' || echo 0)
          fi
          [ -z "$LATEST" ] && LATEST=0
          NEXT=$(( LATEST > BUILD_NUMBER ? LATEST + 1 : BUILD_NUMBER + 1 ))
          echo "Newest build in App Store Connect: $LATEST, Codemagic counter: $BUILD_NUMBER, using build $NEXT"
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all $NEXT
          cd ../..
          ruby native/add-watch-target.rb --set-version 1.0 $NEXT
      - name: Project details for the log (what Xcode sees; nothing is changed here)
        script: |
          echo "objectVersion: $(grep -m1 objectVersion ios/App/App.xcodeproj/project.pbxproj)"
          xcodebuild -project ios/App/App.xcodeproj -list 2>&1 | tail -50
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | grep -E "^ +(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|MARKETING_VERSION|CURRENT_PROJECT_VERSION) =|error|Error" | head -30 || true
      - name: Build the app (the watch app is built and embedded with it)
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
      - name: Check the watch app is inside the iPhone app
        script: |
          if unzip -l build/ios/ipa/*.ipa | grep -qE "Payload/App.app/Watch/.*\.app/"; then
            echo "watch app found inside the iPhone app"
          else
            echo "The watch app is not inside the .ipa"; exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: internal testers get the build in TestFlight without Beta App Review. (true can fail with a 422 whenever
        # another build is already in review, and a HealthKit build needs extra privacy/review notes before external testers.)
        # Turn it on to send a build to external testers after the Health section, App Store privacy label, and review notes are ready.
        submit_to_testflight: false

  # Retired: ios-testflight-watch. The ios-testflight workflow above now builds the iPhone app and the Apple Watch app together.
  # If Codemagic's UI still lists "Strokewise iOS + Apple Watch → TestFlight" as a second workflow, delete that leftover there;
  # do not start it. The watch-app branch is kept in GitHub but is no longer the branch to build from.
